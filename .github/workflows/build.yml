name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build --config Release 2>&1 | Tee-Object -FilePath build_output.txt

    - name: Show Build Errors
      if: failure()
      run: |
        Get-Content build_output.txt | Select-Object -Last 100

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_output.txt

    - name: Package Release
      if: success()
      run: |
        New-Item -ItemType Directory -Path release_pkg -Force
        if (Test-Path "build/bin/Release/YanlvTimer.exe") {
          Copy-Item "build/bin/Release/YanlvTimer.exe" -Destination "release_pkg/YanlvTimer.exe"
        } elseif (Test-Path "build/bin/YanlvTimer.exe") {
          Copy-Item "build/bin/YanlvTimer.exe" -Destination "release_pkg/YanlvTimer.exe"
        } else {
          Copy-Item (Get-ChildItem -Recurse -Filter "YanlvTimer.exe").FullName[0] -Destination "release_pkg/YanlvTimer.exe"
        }
        if (Test-Path "assets") {
          Copy-Item -Recurse -Path "assets" -Destination "release_pkg/assets"
        }
        Compress-Archive -Path "release_pkg/*" -DestinationPath "YanlvTimer-windows-x64.zip" -Force

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: YanlvTimer-windows-x64
        path: YanlvTimer-windows-x64.zip

    - name: Publish GitHub Release
      if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && format('言律时钟 {0}', github.ref_name) || '言律时钟 v1.0.0' }}
        files: |
          YanlvTimer-windows-x64.zip
          release_pkg/YanlvTimer.exe
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
