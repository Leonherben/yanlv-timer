name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build --config Release 2>&1 | Tee-Object -FilePath build_output.txt

    - name: Show Build Errors
      if: failure()
      run: |
        Get-Content build_output.txt | Select-Object -Last 100

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_output.txt

    - name: Upload Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: YanlvTimer-windows-x64
        path: build/bin/**/YanlvTimer.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/bin/**/YanlvTimer.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
